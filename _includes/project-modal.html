<div id="project-modal" class="fixed inset-0 z-50 bg-black/90 backdrop-blur-md hidden items-center justify-center p-4 sm:p-8" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="bw-frame bg-[#171717] border-2 border-white max-w-2xl w-full p-6 sm:p-8 space-y-6 relative max-h-[90vh] overflow-y-auto">

    <button type="button" data-close-modal class="absolute top-4 right-4 p-2 text-white hover:text-neutral-300 border border-neutral-700 bg-black cursor-pointer" aria-label="Close dossier">
      <span class="material-symbols-outlined text-lg">close</span>
    </button>

    <div class="border-b border-neutral-800 pb-4">
      <span id="modal-category" class="font-mono text-xs text-white uppercase tracking-widest font-bold">SYSTEM SPECIFICATION</span>
      <h3 id="modal-title" class="font-headline text-2xl sm:text-3xl font-bold text-white uppercase pt-1">System Title</h3>
    </div>

    <div class="space-y-4">
      <div>
        <h4 class="font-mono text-xs uppercase tracking-wider text-white font-bold">System Scope &amp; Objective</h4>
        <p id="modal-description" class="font-body text-sm text-neutral-400 leading-relaxed pt-1"></p>
      </div>
      <div>
        <h4 class="font-mono text-xs uppercase tracking-wider text-white font-bold">Backend Architecture Solution</h4>
        <p id="modal-solution" class="font-body text-sm text-neutral-400 leading-relaxed pt-1"></p>
      </div>
      <div class="border-t border-neutral-800 pt-4">
        <h4 class="font-mono text-xs uppercase tracking-wider text-white font-bold pb-2">Technical Components</h4>
        <div id="modal-techs" class="flex flex-wrap gap-2 font-mono text-xs"></div>
      </div>
    </div>

    <div class="pt-4 border-t border-neutral-800 flex justify-end">
      <button type="button" data-close-modal class="px-6 py-2.5 bg-white text-black font-mono text-xs uppercase tracking-widest font-bold hover:bg-neutral-200 transition cursor-pointer">Close Dossier</button>
    </div>
  </div>
</div>
