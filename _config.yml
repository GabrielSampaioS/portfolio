title: Gabriel Sampaio
description: "Portfólio de Gabriel Sampaio, desenvolvedor Backend Júnior: APIs REST com Node.js e TypeScript, Clean Architecture, DDD e testes automatizados."
lang: pt-BR
# Em produção, o workflow do GitHub Actions passa --baseurl com o caminho do repositório (/portfolio).
url: "https://gabrielsampaios.github.io"
baseurl: ""

# Cada arquivo de _projetos/ vira uma página em /projetos/<nome-do-arquivo>/
collections:
  projetos:
    output: true
    permalink: /projetos/:name/

defaults:
  - scope:
      path: ""
      type: projetos
    values:
      layout: projeto

exclude:
  - README.md
  - docs
  - node_modules
  - package.json
  - Gemfile.lock
