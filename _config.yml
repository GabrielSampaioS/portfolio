title: Gabriel Sampaio
description: Portfólio de Gabriel Sampaio, desenvolvedor back-end.
lang: pt-BR
url: "https://gabrielsampaios.github.io"   # ALTERE para a URL do seu GitHub Pages
baseurl: ""

# Cada arquivo de _projetos/ vira uma página em /projetos/<nome-do-arquivo>/
collections:
  projetos:
    output: true
    permalink: /projetos/:name/

defaults:
  - scope:
      path: ""
      type: projetos
    values:
      layout: projeto

exclude:
  - README.md
  - node_modules
  - package.json
  - Gemfile.lock
