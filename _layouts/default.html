{% assign ui = site.data.ui %}
<!DOCTYPE html>
<html lang="{{ site.lang | default: 'pt-BR' }}" class="scroll-smooth bg-black">
{% include head.html %}
<body class="bg-[#05080e] text-[#F2F0EB] font-body antialiased min-h-screen selection:bg-white selection:text-black monochrome-canvas relative">
  <a class="skip-link" href="#{{ ui.site.main_id }}">{{ ui.site.skip_link }}</a>
  {% include header.html %}

  <main id="{{ ui.site.main_id }}" tabindex="-1" class="max-w-7xl mx-auto px-6 sm:px-12 outline-none">
    {{ content }}
  </main>

  {% include decor/footer-vine.html %}
  {% include footer.html %}

  <script src="{{ '/assets/js/nav.js' | relative_url }}" defer></script>
  {% for js in page.scripts %}
  <script src="{{ '/assets/js/' | append: js | relative_url }}" defer></script>
  {% endfor %}
</body>
</html>
